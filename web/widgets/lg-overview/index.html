<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LG ThinQ Widget</title>
    <link rel="stylesheet" href="../../assets/homenavi.css" />
    <script src="../../assets/icons.js" defer></script>
    <style>
      body { background: transparent; overflow-x: hidden; overflow-y: auto; --color-surface-panel-soft: rgba(28, 34, 44, 0.72); --color-surface-chip: rgba(28, 34, 44, 0.72); }
      body::before { display: none; }
      .hn-page { padding: 10px 12px; }
      .hn-card__body { padding: 0; }
      .hn-kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
      .hn-kpi {
        min-width: 0;
        padding: 6px 8px;
        border-radius: 8px;
      }
      .hn-kpi__label { font-size: 0.68rem; margin-bottom: 4px; overflow-wrap: anywhere; }
      .hn-kpi__value { font-size: 0.95rem; }
      .hn-device {
        padding: 8px;
        border-radius: 8px;
      }
      .hn-list { gap: 6px; }
      .hn-device__name { font-size: 0.92rem; font-weight: 700; letter-spacing: 0; }
      .hn-device__meta { margin-top: 2px; }
      .hn-chip { padding: 3px 7px; }
    </style>
  </head>
  <body>
    <main class="hn-page">
      <div class="hn-card__body">
        <div class="hn-row" style="align-items:flex-start;">
          <div class="hn-brand" style="gap:10px;">
            <span class="hn-brand__icon" aria-hidden="true" style="width:32px;height:32px;border-radius:8px;">
              <img src="../../assets/icon.png" alt="" />
            </span>
            <div class="hn-brand__title">
              <div style="font-weight:700;">Devices</div>
              <div id="summary" class="hn-muted hn-small">Loading mapped devices…</div>
            </div>
          </div>
        </div>

          <div class="hn-kpis">
            <div class="hn-kpi"><div class="hn-kpi__label">Devices</div><div id="statTotal" class="hn-kpi__value">-</div></div>
            <div class="hn-kpi"><div class="hn-kpi__label">Online</div><div id="statOnline" class="hn-kpi__value">-</div></div>
            <div class="hn-kpi"><div class="hn-kpi__label">Power On</div><div id="statPowerOn" class="hn-kpi__value">-</div></div>
          </div>

        <div id="devices" class="hn-list" style="margin-top:10px;"></div>
      </div>
    </main>
    <script src="./widget.js" defer></script>
  </body>
</html>
